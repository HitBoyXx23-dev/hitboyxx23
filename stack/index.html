<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#05060a">
  <title>My Stack · HitBoyXx23</title>

  <link rel="icon" href="../public/assets/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="../public/css/style.css">
  <link rel="stylesheet" href="../public/css/components/stack.css">
</head>
<body>

<div class="back-to-home">
  <button type="button" class="back-button" onclick="window.location.href='../'">
    <svg
      aria-hidden="true"
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round">
      <path d="m15 18-6-6 6-6"></path>
    </svg>
    return home
  </button>
</div>

<main class="main">
  <section class="section stack-section">
    <div class="container">

      <div class="stack-grid">

        <div class="stack-card">
          <span class="stack-ext">.py</span>
          <strong>Python</strong>
        </div>

        <div class="stack-card">
          <span class="stack-ext">.java</span>
          <strong>Java</strong>
        </div>

        <div class="stack-card">
          <span class="stack-ext">.html</span>
          <strong>HTML</strong>
        </div>

        <div class="stack-card">
          <span class="stack-ext">.css</span>
          <strong>CSS</strong>
        </div>

        <div class="stack-card">
          <span class="stack-ext">.js</span>
          <strong>JavaScript</strong>
        </div>

        <div class="stack-card">
          <span class="stack-ext">.rs</span>
          <strong>Rust</strong>
        </div>

        <div class="stack-card">
          <span class="stack-ext">.cs</span>
          <strong>C#</strong>
        </div>

        <div class="stack-card">
          <span class="stack-ext">.c</span>
          <strong>C</strong>
        </div>

        <div class="stack-card">
          <span class="stack-ext">.cpp</span>
          <strong>C++</strong>
        </div>

        <div class="stack-card">
          <span class="stack-ext">.sh</span>
          <strong>Shell</strong>
        </div>

        <div class="stack-card">
          <span class="stack-ext">.lua</span>
          <strong>Lua</strong>
        </div>

        <div class="stack-card">
          <span class="stack-ext">.ts</span>
          <strong>TypeScript</strong>
        </div>

        <div class="stack-card">
          <span class="stack-ext">.tsx</span>
          <strong>TSX</strong>
        </div>

        <div class="stack-card">
          <span class="stack-ext">.php</span>
          <strong>PHP</strong>
        </div>

        <div class="stack-card">
          <span class="stack-ext">.bat</span>
          <strong>Batch</strong>
        </div>

        <div class="stack-card">
          <span class="stack-ext">.go</span>
          <strong>Go</strong>
        </div>

      </div>

    </div>
  </section>
</main>

</body>
</html>
